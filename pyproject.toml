[project]
name = "profile-metrics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=metrics --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["metrics/__main__.py"]
